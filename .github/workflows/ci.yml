name: Dot Space CI

on:
  push:
    branches: [main, v0.9-production-hardening]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund
      - name: Verify monorepo
        run: npm run verify
