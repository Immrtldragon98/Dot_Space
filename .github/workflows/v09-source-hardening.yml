name: Harden V0.9 Realtime Lifecycle

on:
  push:
    branches: [v0.9-production-hardening]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.9-production-hardening

      - name: Patch realtime effect cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('apps/mobile/App.tsx')
          text = path.read_text()
          pattern = re.compile(r"  useEffect\(\(\)=>\{\(async\(\)=>\{.*?\}\)\(\)\.catch\(e=>setError\(e instanceof Error\?e\.message:'Could not load your Space'\)\);\},\[token\]\);", re.S)
          replacement = """  useEffect(()=>{\n    let disposed=false;\n    let appStateSub:{remove:()=>void}|null=null;\n    let idleTimer:ReturnType<typeof setInterval>|null=null;\n    let heartbeatTimer:ReturnType<typeof setInterval>|null=null;\n    let realtime:ReturnType<typeof createRealtime>|null=null;\n\n    (async()=>{\n      const deviceId=await getPersistentDeviceId();\n      let pushToken:string|null=null;\n      try{pushToken=await getPushToken();}catch{}\n      await api.registerDevice(token,{deviceId,deviceName:getDeviceLabel(),platform:Platform.OS==='android'||Platform.OS==='ios'||Platform.OS==='web'?Platform.OS:'unknown',pushToken});\n      if(disposed)return;\n      setPushState(pushToken?'Push notifications ready':'Push unavailable here; realtime still works');\n      await load();\n      if(disposed)return;\n\n      const socket=createRealtime(token,deviceId);\n      realtime=socket;\n      socketRef.current=socket;\n      const emit=(state:Exclude<ConnectionState,'OFFLINE'>)=>{stateRef.current=state;if(socket.connected)socket.emit('presence:set',{state});};\n      socket.on('connect',()=>{setLive(true);emit(appStateRef.current==='active'?'ACTIVE':'BACKGROUND');});\n      socket.on('disconnect',()=>setLive(false));\n      socket.on('presence:changed',(e:PresenceChanged)=>setPeople(v=>v.map(p=>p.id===e.userId?{...p,connectionState:e.connectionState,lastSeenAt:e.lastSeenAt}:p)));\n      socket.on('status:changed',(e:StatusChanged)=>setPeople(v=>v.map(p=>p.id===e.userId?{...p,humanStatus:e.humanStatus,customStatus:e.customStatus,statusExpiresAt:e.statusExpiresAt}:p)));\n      socket.on('privacy:changed',()=>void load());\n      socket.on('signal:received',(s:Signal)=>{setSignals(v=>[s,...v].slice(0,30));setNotice(`${signalMeta[s.kind].emoji} ${s.senderDisplayName??'Someone'} · ${signalMeta[s.kind].label}`)});\n\n      appStateSub=AppState.addEventListener('change',next=>{appStateRef.current=next;if(next==='active'){lastInteraction.current=Date.now();emit('ACTIVE');}else emit('BACKGROUND');});\n      idleTimer=setInterval(()=>{if(appStateRef.current==='active'){const next=Date.now()-lastInteraction.current>=IDLE_AFTER_MS?'IDLE':'ACTIVE';if(next!==stateRef.current)emit(next);}},5000);\n      heartbeatTimer=setInterval(()=>{if(socket.connected)socket.emit('presence:heartbeat',{state:stateRef.current});},20000);\n    })().catch(e=>{if(!disposed)setError(e instanceof Error?e.message:'Could not load your Space');});\n\n    return()=>{\n      disposed=true;\n      appStateSub?.remove();\n      if(idleTimer)clearInterval(idleTimer);\n      if(heartbeatTimer)clearInterval(heartbeatTimer);\n      realtime?.disconnect();\n      if(socketRef.current===realtime)socketRef.current=null;\n    };\n  },[token]);"""
          new_text, count = pattern.subn(replacement, text, count=1)
          if count == 0:
              print('Realtime effect already patched or pattern changed; no source update needed.')
          else:
              path.write_text(new_text)
              print('Patched realtime effect cleanup.')
          PY

      - name: Verify mobile types
        run: |
          npm install --include=dev --no-audit --no-fund
          npm run verify

      - name: Commit source hardening
        run: |
          if git diff --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/App.tsx
          git commit -m "fix(mobile): clean up realtime lifecycle correctly"
          git push origin HEAD:v0.9-production-hardening
