name: Build Android APK

on:
  push:
    branches: [v0.9-production-hardening]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Verify project
        run: npm run verify

      - name: Generate Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --non-interactive --clean

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk Dot-Space-v0.9-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Dot-Space-v0.9-Android-APK
          path: Dot-Space-v0.9-debug.apk
          if-no-files-found: error
          retention-days: 14
